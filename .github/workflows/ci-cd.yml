name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: TypeCheck
        run: pnpm typecheck
      
      - name: Lint
        run: pnpm lint --max-warnings 0
      
      - name: Run unit tests
        run: pnpm test --coverage
        env:
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
  
  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build API server
        run: pnpm -C artifacts/api-server build
      
      - name: Build web frontend
        run: pnpm -C artifacts/mockup-sandbox build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            artifacts/api-server/dist
            artifacts/mockup-sandbox/dist
  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Start API server
        run: |
          cd artifacts/api-server
          pnpm build &
          sleep 5
          pnpm start &
        env:
          NODE_ENV: test
          AI_INTEGRATIONS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: ""
      
      - name: Start frontend
        run: |
          cd artifacts/mockup-sandbox
          pnpm build &
        env:
          NODE_ENV: test
      
      - name: Wait for services
        run: sleep 10
      
      - name: Run Cypress E2E tests
        run: cd artifacts/e2e && pnpm test:e2e:ci
      
      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-videos
          path: artifacts/e2e/cypress/videos
      
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots
          path: artifacts/e2e/cypress/screenshots
  
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security audit
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true
      
      - name: SAST with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
