kind = "mobile"
previewPath = "/"
title = "SmartGrader UPC"
version = "1.0.0"
id = "artifacts/smartgrader"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18332

[services.development]
run = "pnpm --filter @workspace/corrigo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/corrigo", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/corrigo", "run", "serve" ]

[services.env]
PORT = "18332"
BASE_PATH = "/"
